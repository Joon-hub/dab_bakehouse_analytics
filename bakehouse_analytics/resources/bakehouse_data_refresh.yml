# A sample job for bakehouse_analytics.

resources:
  jobs:
    sample_job:
      name: bakehouse_data_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: src/customer_360.ipynb
        - task_key: notebook_task_2
          notebook_task:
            notebook_path: src/nyc_taxi_analysis.ipynb
        - task_key: nyc_taxi_hourly_fare_analysis
          notebook_task:
            notebook_path: src/nyc_taxi_analysis_2.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      git_source:
        git_branch: dev
        git_provider: gitHub
        git_url: https://github.com/Joon-hub/dab_bakehouse_analytics.git
